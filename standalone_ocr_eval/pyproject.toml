[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-text-eval"
version = "0.5.1"
description = "OCR full-text agreement, two-family passage corroboration, and reference-based field evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ocr-eval = "ocr_eval.cli:main"

[tool.setuptools]
packages = ["ocr_eval"]
