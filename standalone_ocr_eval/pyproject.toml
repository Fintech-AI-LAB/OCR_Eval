[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-text-eval"
version = "0.4.0"
description = "OCR consensus and reference-based critical-field evaluation with document profiles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ocr-eval = "ocr_eval.cli:main"

[tool.setuptools]
packages = ["ocr_eval"]
